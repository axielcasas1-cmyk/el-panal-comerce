<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KHAMINDRYA Radar Tests</title><style>body{font-family:system-ui;background:#071018;color:#eaf4fb;padding:24px}li{margin:8px 0}.ok{color:#62d6a2}.bad{color:#ff7c7c}</style></head><body><h1>KHAMINDRYA Radar — pruebas</h1><ol id="out"></ol><script src="./radar.js"></script><script>const out=document.getElementById('out');function test(name,fn){const li=document.createElement('li');try{fn();li.textContent='PASS — '+name;li.className='ok'}catch(e){li.textContent='FAIL — '+name+' — '+e.message;li.className='bad'}out.appendChild(li)}function assert(v,m){if(!v)throw new Error(m)}test('API local KRadar disponible',()=>assert(window.KRadar,'KRadar no existe'));test('seed contiene 11 canales',()=>assert(window.KRadar.defaultState().channels.length===11,'canales incorrectos'));test('sin credenciales ningún canal nace conectado',()=>assert(window.KRadar.defaultState().channels.every(c=>c.status==='NOT_CONNECTED'),'estado inválido'));test('sincronización conserva honestidad de datos',()=>{const s=window.KRadar.defaultState();const n=window.KRadar.syncState(s);assert(n.channels.every(c=>c.status==='NOT_CONNECTED'),'se inventó conexión');assert(n.activity.length===1,'no registró actividad')});test('conexión verificada se conserva',()=>{const s=window.KRadar.defaultState();s.channels[0].verified=true;s.channels[0].status='CONNECTED';const n=window.KRadar.syncState(s);assert(n.channels[0].status==='CONNECTED','perdió conexión verificada')});test('campaña comercial inicial existe',()=>assert(window.KRadar.defaultState().campaigns[0].title.includes('Nacimiento de las Aguas'),'falta campaña inicial'));test('distribución declarada cubre Amazon, Kobo y Google',()=>assert(window.KRadar.defaultState().distribution.length===3,'falta distribución'));</script></body></html>

name: Build DRAGOLAIDA CASAS APK
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-dragolaida-apk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DRAGOLAIDA source
        uses: actions/checkout@v4
        with:
          ref: dragolaida-build-final
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Rebuild embedded offline library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          parts = sorted(Path('dragolaida-android-app/asset_chunks').glob('part*.txt'))
          assert parts, 'No asset chunks found'
          target = Path('dragolaida-android-app/app/src/main/assets/index.html')
          target.parent.mkdir(parents=True, exist_ok=True)

          def clean(s):
              return re.sub(r'\s+', '', s)
          def b64(s):
              s = clean(s)
              s += '=' * ((4 - len(s) % 4) % 4)
              return base64.b64decode(s, validate=False)

          errors=[]
          # Mode 1: chunks are slices of one Base64 stream.
          try:
              joined = ''.join(clean(p.read_text(encoding='utf-8')) for p in parts)
              data = gzip.decompress(b64(joined))
              target.write_bytes(data)
              print('Recovered as concatenated Base64 stream')
          except Exception as e:
              errors.append(('joined', repr(e)))
              # Mode 2: chunks were Base64-encoded separately from consecutive gzip bytes.
              try:
                  compressed = b''.join(b64(p.read_text(encoding='utf-8')) for p in parts)
                  data = gzip.decompress(compressed)
                  target.write_bytes(data)
                  print('Recovered as separately encoded binary chunks')
              except Exception as e2:
                  errors.append(('separate-binary', repr(e2)))
                  # Mode 3: each chunk is an independent gzip member containing consecutive HTML text.
                  try:
                      data = b''.join(gzip.decompress(b64(p.read_text(encoding='utf-8'))) for p in parts)
                      target.write_bytes(data)
                      print('Recovered as independent gzip members')
                  except Exception as e3:
                      errors.append(('gzip-members', repr(e3)))
                      raise RuntimeError('Unable to reconstruct offline library: '+repr(errors))

          text = target.read_text(encoding='utf-8')
          assert 'DRAGOLAIDA CASAS' in text, 'Brand marker missing in reconstructed app'
          assert len(text) > 10000, 'Reconstructed app is unexpectedly small'
          print('DRAGOLAIDA offline app recovered:', len(text), 'characters from', len(parts), 'chunks')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: dragolaida-android-app
        run: gradle assembleDebug --stacktrace
      - name: Prepare installer
        run: cp dragolaida-android-app/app/build/outputs/apk/debug/app-debug.apk DRAGOLAIDA-CASAS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DRAGOLAIDA-CASAS-APK
          path: DRAGOLAIDA-CASAS.apk
          retention-days: 30

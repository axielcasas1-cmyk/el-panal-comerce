name: Build DRAGOLAIDA CASAS APK
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-dragolaida-apk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DRAGOLAIDA source
        uses: actions/checkout@v4
        with:
          ref: dragolaida-build-final
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Rebuild and verify embedded offline library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          d=Path('dragolaida-android-app/clean_chunks')
          def r(n): return (d/n).read_text(encoding='utf-8')
          pieces=[r('chunk01.txt'),r('chunk02.txt'),r('chunk03.txt'),r('chunk04.txt'),r('fix05a.txt'),r('fix05b.txt'),r('chunk06.txt'),r('fix07a.txt'),r('fix07b.txt')[:8000],r('fix08a.txt')[:8000],r('fix08b1.txt'),r('fix08b2.txt'),r('chunk09.txt')]
          payload=''.join(pieces)
          assert len(payload)==134312, f'Unexpected Base64 length: {len(payload)}'
          actual=hashlib.sha256(payload.encode()).hexdigest()
          assert actual=='d19b76db931cab0fd629a463afe01095ea0ce8227e900b7f8184002a88837212', f'Base64 SHA mismatch: {actual}'
          compressed=base64.b64decode(payload)
          actual_gz=hashlib.sha256(compressed).hexdigest()
          assert actual_gz=='c6f130b4b30b101957718c9b73be6df5add842d8c804d825737ff0ba937e87b6', f'Gzip SHA mismatch: {actual_gz}'
          data=gzip.decompress(compressed)
          actual_html=hashlib.sha256(data).hexdigest()
          assert actual_html=='65dd801bef902a6891da89c95f5f62bf106802b4bc01f0e08aeb9d654e5cd5e3', f'HTML SHA mismatch: {actual_html}'
          text=data.decode('utf-8')
          assert 'DRAGOLAIDA CASAS' in text
          assert len(data)==261571, f'Unexpected HTML size: {len(data)}'
          target=Path('dragolaida-android-app/app/src/main/assets/index.html')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print('Verified offline library:',len(data),'bytes')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: dragolaida-android-app
        run: gradle assembleDebug --stacktrace
      - name: Prepare installer
        run: cp dragolaida-android-app/app/build/outputs/apk/debug/app-debug.apk DRAGOLAIDA-CASAS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DRAGOLAIDA-CASAS-APK
          path: DRAGOLAIDA-CASAS.apk
          retention-days: 30

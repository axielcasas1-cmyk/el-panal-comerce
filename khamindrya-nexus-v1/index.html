<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090e"><title>KHAMINDRYA NEXUS</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>html,body{margin:0;min-height:100%;background:#05070b;color:#e7c479;font-family:system-ui}body{display:grid;place-items:center}#boot{text-align:center;padding:28px}#boot b{display:block;font:700 34px Georgia,serif;margin-bottom:12px}#boot small{color:#aeb5bd}</style></head><body><div id="boot"><b>KHAMINDRYA NEXUS</b><small>Abriendo la puerta digital…</small></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Actualiza Chrome para abrir el paquete offline.');const parts=await Promise.all([1,2,3].map(n=>fetch(`./payload-${n}.txt`).then(r=>{if(!r.ok)throw new Error('payload '+n);return r.text()})));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(text);document.close()}catch(e){document.getElementById('boot').innerHTML='<b>No se pudo iniciar KHAMINDRYA</b><small>'+String(e.message||e)+'</small>'}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
